<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Points d'intérêt sur image</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300&display=swap" rel="stylesheet">


  <style>
:root {
  /*--accent: #21007F;*/
  --accent: #E5506B;
  --player-bg: #1c1c1e;
  --player-text: #ffffff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  
font-family: "Figtree", sans-serif;
  font-weight: 300;
  
  background: #000;
  overflow: hidden;
}

.image-container {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: #000;
}

.image-container img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* =========================
   MARQUEURS
   ========================= */

.poi {
  position: absolute;
  width: 24px;
  height: 24px;
  background: var(--accent);
  border: 4px solid white;
  border-radius: 50%;
  cursor: pointer;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
  z-index: 2;
  overflow: visible;
}

.poi:hover {
  transform: translate(-50%, -50%) scale(1.1);
}

/* Le marqueur survolé ou actif passe devant tous les autres */
.poi:hover,
.poi:focus-visible,
.poi.active,
.poi.playing {
  z-index: 100;
}

.poi.playing {
  box-shadow: 0 0 0 0 rgba(230, 80, 100, 0.6);
  animation: pulse 1.6s infinite;
}

@keyframes pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(230, 80, 100, 0.55);
  }
  70% {
    box-shadow: 0 0 0 14px rgba(230, 80, 100, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(230, 80, 100, 0);
  }
}

/* =========================
   TOOLTIP
   ========================= */

.tooltip {
  position: absolute;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);

  background: rgba(0, 0, 0, 0.9);
  color: white;

  padding: 8px 12px;
  border-radius: 6px;

  white-space: nowrap;
  font-size: 14px;
  line-height: 1.3;

  opacity: 0;
  pointer-events: none;

  transition: opacity 0.15s ease;

  z-index: 101;
}

/* Petite flèche sous le tooltip */
.tooltip::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 100%;
  transform: translateX(-50%);

  border-width: 6px;
  border-style: solid;
  border-color: rgba(0, 0, 0, 0.9) transparent transparent transparent;
}

.poi:hover .tooltip,
.poi:focus-visible .tooltip,
.poi.active .tooltip {
  opacity: 1;
}

.poi:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

/* =========================
   LECTEUR AUDIO
   ========================= */

.audio-player {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;

  background: var(--player-bg);
  color: var(--player-text);

  padding: 12px 16px;

  display: flex;
  align-items: center;
  gap: 14px;

  transform: translateY(100%);
  transition: transform 0.3s ease;

  z-index: 1000;

  box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.3);
}

.audio-player.open {
  transform: translateY(0);
}

.audio-player button {
  background: none;
  border: none;
  color: white;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 6px;
  flex-shrink: 0;
}

.audio-player .play-pause {
  width: 38px;
  height: 38px;
  background: var(--accent);
  border-radius: 50%;
}

.audio-player .play-pause svg,
.audio-player .close-btn svg {
  width: 16px;
  height: 16px;
}

.player-info {
  flex: 1;
  min-width: 0;

  display: flex;
  flex-direction: column;
  gap: 4px;
}

.player-title {
  font-size: 14px;
  font-weight: bold;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.player-time {
  font-size: 11px;
  color: #c7c7cc;

  min-width: 34px;
  text-align: center;
  flex-shrink: 0;
}

.player-progress {
  flex: 1;

  -webkit-appearance: none;
  appearance: none;

  height: 4px;
  border-radius: 2px;

  background: #4a4a4c;
  cursor: pointer;

  accent-color: var(--accent);
}

.player-progress::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;

  width: 12px;
  height: 12px;

  border-radius: 50%;
  background: white;
  cursor: pointer;
}

.player-progress::-moz-range-thumb {
  width: 12px;
  height: 12px;

  border: none;
  border-radius: 50%;

  background: white;
  cursor: pointer;
}

/* =========================
   MOBILE
   ========================= */

@media (max-width: 480px) {
  .player-title {
    font-size: 13px;
  }

  .audio-player {
    padding: 10px 12px;
    gap: 10px;
  }

  .tooltip {
    font-size: 12px;
    padding: 6px 10px;
    max-width: 220px;
    white-space: normal;
    text-align: center;
  }
}
  </style>
</head>
<body>
  <div class="image-container" id="imageContainer">
    <img id="mapImage" src="fond de carte.jpg" alt="Image exemple">
  </div>

  <div class="audio-player" id="audioPlayer">
    <button class="play-pause" id="playPauseBtn" aria-label="Lecture / Pause">
      <svg id="playIcon" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="white" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>

    <div class="player-info">
      <div class="player-title" id="playerTitle">Titre de l'audio</div>
      <div class="player-progress-row">
        <span class="player-time" id="currentTime">0:00</span>
        <input type="range" class="player-progress" id="progressBar" value="0" min="0" max="100" step="0.1">
        <span class="player-time" id="duration">0:00</span>
      </div>
    </div>

    <button class="close-btn" id="closeBtn" aria-label="Fermer le lecteur">
      <svg viewBox="0 0 24 24" fill="white"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <script>
const points = [
  {
    id: 1,
    x: 0.13726,
    y: 0.28711,
    title: "0. Place du Château-d’Eau, un lion mélancolique observe la Place de la République",
    audioUrl: "https://stream.gael-maignan.workers.dev/?id=1A9doFG9NwNf4YJNYfFFQhdYJvrMFUWo9"
  },
  {
    id: 2,
    x: 0.19985,
    y: 0.35817,
    title: "1. Passage du Jeu-de-Boules, une inconnue embrasse un casquetier",
    audioUrl: "https://exemple.com/audios/nord-ouest.mp3"
  },
  {
    id: 3,
    x: 0.27048,
    y: 0.46017,
    title: "2. Devant Bataclan, 90 clous pour se souvenir",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 4,
    x: 0.30659,
    y: 0.44756,
    title: "3. En face de Bataclan, un sergent-écrivain contribue à l’effort de guerre allemand",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 5,
    x: 0.35394,
    y: 0.52321,
    title: "4. Céline et Julie vont au cinéma",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 6,
    x: 0.39246,
    y: 0.50716,
    title: "5. Église Saint-Ambroise, la mariée ne manifeste pas",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 7,
    x: 0.43821,
    y: 0.60688,
    title: "6. Rue Sedaine, une confectionneuse tente d’empêcher un lynchage",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 8,
    x: 0.47031,
    y: 0.54040,
    title: "7. Défilé de statues devant la mairie",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 9,
    x: 0.53290,
    y: 0.70544,
    title: "8. Des autobus pour se rendre au gymnase",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 10,
    x: 0.58587,
    y: 0.74212,
    title: "9. Métro Charonne, Nestor Burma prend un coup sur la tête",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 11,
    x: 0.67415,
    y: 0.80745,
    title: "10. Rue des Boulets, une institutrice énumère des objets",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 12,
    x: 0.82583,
    y: 0.88309,
    title: "11. Rue de Montreuil, une couturière assiste à une inauguration",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 13,
    x: 0.74477,
    y: 0.88768,
    title: "12. Rue des Immeubles-Industriels, embellissement",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  },
  {
    id: 14,
    x: 0.87077,
    y: 0.95874,
    title: "13. Casse-pipe à la Nation",
    audioUrl: "https://exemple.com/audios/sud-est.mp3"
  }
];

    const container = document.getElementById("imageContainer");
    const img = document.getElementById("mapImage");

    const audio = new Audio();
    const audioPlayer = document.getElementById("audioPlayer");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const playerTitle = document.getElementById("playerTitle");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const closeBtn = document.getElementById("closeBtn");

    let currentMarker = null;
    let isSeeking = false;

    function formatTime(seconds) {
      if (!isFinite(seconds)) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function showPlayIcon() {
      playIcon.style.display = "block";
      pauseIcon.style.display = "none";
    }

    function showPauseIcon() {
      playIcon.style.display = "none";
      pauseIcon.style.display = "block";
    }

    function getRenderedImageRect() {
      const cw = container.clientWidth;
      const ch = container.clientHeight;
      const nw = img.naturalWidth;
      const nh = img.naturalHeight;

      if (!nw || !nh) {
        return { left: 0, top: 0, width: cw, height: ch };
      }

      const containerRatio = cw / ch;
      const imageRatio = nw / nh;

      let width, height, left, top;

      if (imageRatio > containerRatio) {
        width = cw;
        height = cw / imageRatio;
        left = 0;
        top = (ch - height) / 2;
      } else {
        height = ch;
        width = ch * imageRatio;
        top = 0;
        left = (cw - width) / 2;
      }

      return { left, top, width, height };
    }

    function positionMarkers() {
      const rect = getRenderedImageRect();

      document.querySelectorAll(".poi").forEach((marker, index) => {
        const point = points[index];
        marker.style.left = `${rect.left + point.x * rect.width}px`;
        marker.style.top = `${rect.top + point.y * rect.height}px`;
      });
    }

    function openPlayer(point, marker) {
      if (currentMarker && currentMarker !== marker) {
        currentMarker.classList.remove("playing");
      }

      currentMarker = marker;
      marker.classList.add("playing");

      playerTitle.textContent = point.title;
      audio.src = point.audioUrl;
      audio.currentTime = 0;
      audio.play().catch(err => console.warn("Lecture impossible :", err));

      audioPlayer.classList.add("open");
    }

    function closePlayer() {
      audio.pause();
      audioPlayer.classList.remove("open");

      if (currentMarker) {
        currentMarker.classList.remove("playing");
        currentMarker = null;
      }
    }

    function createMarkers() {
      points.forEach(point => {
        const marker = document.createElement("div");
        marker.className = "poi";
        marker.tabIndex = 0;
        marker.setAttribute("role", "button");
        marker.setAttribute("aria-label", point.title);

        const tooltip = document.createElement("div");
        tooltip.className = "tooltip";
        tooltip.textContent = point.title;
        marker.appendChild(tooltip);

        const activate = (e) => {
          e.stopPropagation();
          document.querySelectorAll(".poi.active").forEach(el => el.classList.remove("active"));
          marker.classList.add("active");
          openPlayer(point, marker);
        };

        marker.addEventListener("click", activate);

        marker.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            activate(e);
          }
        });

        container.appendChild(marker);
      });
    }

    document.addEventListener("click", () => {
      document.querySelectorAll(".poi.active").forEach(el => el.classList.remove("active"));
    });

    playPauseBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    closeBtn.addEventListener("click", closePlayer);

    audio.addEventListener("play", showPauseIcon);
    audio.addEventListener("pause", showPlayIcon);

    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
      currentTimeEl.textContent = formatTime(0);
      progressBar.value = 0;
    });

    audio.addEventListener("timeupdate", () => {
      if (isSeeking) return;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      if (audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
      }
    });

    audio.addEventListener("ended", () => {
      showPlayIcon();
      if (currentMarker) currentMarker.classList.remove("playing");
    });

    progressBar.addEventListener("input", () => {
      if (!audio.duration) return;
      isSeeking = true;
      currentTimeEl.textContent = formatTime((progressBar.value / 100) * audio.duration);
    });

    progressBar.addEventListener("change", () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
      isSeeking = false;
    });

    window.addEventListener("resize", positionMarkers);
    window.addEventListener("orientationchange", positionMarkers);

    let markersCreated = false;

function init() {
  if (markersCreated) return;
  markersCreated = true;

  createMarkers();
  positionMarkers();
}

img.addEventListener("load", init);

if (img.complete) {
  init();
}
  </script>

  <button id="fullscreenBtn" class="fullscreen-btn" aria-label="Plein écran">
  ⛶
</button>
<style>
  .fullscreen-btn {
  position: fixed;
  right: 16px;
  bottom: 16px;

  width: 48px;
  height: 48px;

  border: none;
  border-radius: 50%;

  background: rgba(0, 0, 0, 0.75);
  color: white;

  font-size: 24px;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  z-index: 4;

  backdrop-filter: blur(4px);
  transition: transform 0.2s ease, background 0.2s ease;
}

.fullscreen-btn:hover {
  background: rgba(0, 0, 0, 0.9);
  transform: scale(1.05);
}
</style>
<script>const fullscreenBtn = document.getElementById("fullscreenBtn");
fullscreenBtn.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (err) {
    console.error("Erreur plein écran :", err);
  }
});</script>
</body>
