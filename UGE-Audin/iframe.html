<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double iframe redimensionnable</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    flex-direction:column;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.toolbar{
    padding:10px;
    background:#f0f0f0;
    border-bottom:1px solid #ccc;
}

button{
    padding:8px 16px;
    cursor:pointer;
}

.container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow:auto;
    padding:20px;
}

.wrapper{
    position:relative;
    width:800px;
}

/* affichage ratio */
#ratioDisplay{
    position:absolute;
    top:10px;
    right:10px;
    background:rgba(0,0,0,.7);
    color:white;
    padding:4px 8px;
    border-radius:4px;
    font-size:14px;
    z-index:2000;
}

.iframe-box{
    width:100%;
    height:300px;
    border:1px solid #ccc;
    overflow:hidden;
    background:white;
}

.iframe-box:first-child{
    margin-bottom:20px;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* resize handles */
.resize-right{
    position:absolute;
    top:0;
    right:-4px;
    width:8px;
    height:100%;
    cursor:ew-resize;
    z-index:1000;
}

.resize-bottom{
    position:absolute;
    left:0;
    bottom:-4px;
    width:100%;
    height:8px;
    cursor:ns-resize;
    z-index:1000;
}

.resize-corner{
    position:absolute;
    width:18px;
    height:18px;
    right:-4px;
    bottom:-4px;
    background:#666;
    cursor:nwse-resize;
    border-radius:3px;
    z-index:1001;
}

.resize-corner:hover{
    background:#333;
}

.resize-corner::after{
    content:"";
    position:absolute;
    right:3px;
    bottom:3px;
    width:8px;
    height:8px;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;
}

.drag-overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    cursor:inherit;
}
</style>
</head>

<body>

<div class="toolbar">
    <button id="reloadBtn">🔄 Recharger les pages</button>
</div>

<div class="container">

    <div class="wrapper" id="wrapper">

        <div id="ratioDisplay">16/9</div>

        <h2>En ligne</h2>

        <div class="iframe-box" id="box1">
            <iframe id="iframe1"
            src="https://gael-maignan.github.io/divers/UGE-Audin/"></iframe>
        </div>

        <h2>Local</h2>

        <div class="iframe-box" id="box2">
            <iframe id="iframe2"
            src="file:///C:/Users/gael.maignan/OneDrive%20-%20eivp-paris.fr/Ga%C3%ABl%20MAIGNAN%20-%20Stage%20-%20LISAA%20&%20Lab'URBA/%C3%89critures%20Urbaines/Site%20internet/05.06.2025%20Mich%C3%A8le%20Audin/UGE-Audin/index.html"></iframe>
        </div>

        <div class="resize-right"></div>
        <div class="resize-bottom"></div>
        <div class="resize-corner"></div>

    </div>

</div>

<div class="drag-overlay" id="overlay"></div>

<script>

const wrapper = document.getElementById("wrapper");
const box1 = document.getElementById("box1");
const box2 = document.getElementById("box2");
const overlay = document.getElementById("overlay");
const ratioDisplay = document.getElementById("ratioDisplay");

const resizeRight = document.querySelector(".resize-right");
const resizeBottom = document.querySelector(".resize-bottom");
const resizeCorner = document.querySelector(".resize-corner");

let mode = null;
let startX = 0;
let startY = 0;
let startWidth = 0;
let startHeight = 0;

/* gcd pour simplifier ratio */
function gcd(a, b) {
    return b ? gcd(b, a % b) : a;
}

function updateRatio() {

    const width = wrapper.offsetWidth;
    const height = box1.offsetHeight;

    const divisor = gcd(width, height);

    const w = Math.round(width / divisor);
    const h = Math.round(height / divisor);

    ratioDisplay.textContent = `${w}/${h}`;
}

function startResize(e, resizeMode){

    e.preventDefault();

    mode = resizeMode;

    startX = e.clientX;
    startY = e.clientY;

    startWidth = wrapper.offsetWidth;
    startHeight = box1.offsetHeight;

    overlay.style.display = "block";

    overlay.style.cursor =
        mode === "width" ? "ew-resize" :
        mode === "height" ? "ns-resize" :
        "nwse-resize";

    document.body.style.userSelect = "none";
}

resizeRight.addEventListener("mousedown", e => {
    startResize(e, "width");
});

resizeBottom.addEventListener("mousedown", e => {
    startResize(e, "height");
});

resizeCorner.addEventListener("mousedown", e => {
    startResize(e, "both");
});

document.addEventListener("mousemove", e => {

    if(!mode) return;

    if(mode === "width" || mode === "both"){

        let width = startWidth + (e.clientX - startX);
        width = Math.max(200, width);
        wrapper.style.width = width + "px";
    }

    if(mode === "height" || mode === "both"){

        let height = startHeight + (e.clientY - startY);
        height = Math.max(100, height);

        box1.style.height = height + "px";
        box2.style.height = height + "px";
    }

    updateRatio();
});

document.addEventListener("mouseup", () => {
    mode = null;
    overlay.style.display = "none";
    document.body.style.userSelect = "";
});

document.getElementById("reloadBtn")
.addEventListener("click", () => {

    const iframe1 = document.getElementById("iframe1");
    const iframe2 = document.getElementById("iframe2");

    iframe1.src = iframe1.src;
    iframe2.src = iframe2.src;
});

updateRatio();

</script>

</body>
</html>
