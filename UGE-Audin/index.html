<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Points d'intérêt sur image</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #E5506B;
      --border: white;
      --accent2: #E5506B;
      --player-bg: #1c1c1e;
      --player-text: #ffffff;
      --player-height: 88px;
    }

    * { box-sizing: border-box; }

    html {
      font-size: 16px;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Figtree", sans-serif;
      font-weight: 300;
      background: #000;
      overflow: hidden;
    }

    /* =========================
       LAYOUT PRINCIPAL
       ========================= */
    /* L'image occupe tout l'espace SAUF le bas réservé au lecteur */
    .image-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      /* La hauteur s'adapte dynamiquement selon l'état du lecteur */
      bottom: var(--player-height);
      background: #000;

    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* =========================
       MARQUEURS
       ========================= */
    .poi {
      position: absolute;
      width: 32px;
      height: 32px;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.2s ease;
      z-index: 2;
      overflow: visible;
    }

    .poi:hover { transform: translate(-50%, -50%) scale(1.12); }

    .poi:hover, .poi:focus-visible, .poi.active, .poi.loading, .poi.playing {
      z-index: 100;
    }

    .poi-star {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      transform-origin: 50% 50%;
      fill: var(--accent2);
      stroke: var(--border);
      stroke-width: 1.8;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.95));
      transition: filter 0.2s ease;
      animation: star-idle-pulse 2.2s ease-in-out infinite;
    }

    @keyframes star-idle-pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.18); }
    }

    .poi:hover .poi-star, .poi:focus-visible .poi-star, .poi.active .poi-star {
      animation-play-state: paused;
    }

    .poi.loading .poi-star, .poi.playing .poi-star {
      animation: none;
      transform: scale(1);
    }

    @media (prefers-reduced-motion: reduce) { .poi-star { animation: none; } }

    .poi.playing::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(230,80,100,0.55); }
      70%  { box-shadow: 0 0 0 14px rgba(230,80,100,0); }
      100% { box-shadow: 0 0 0 0 rgba(230,80,100,0); }
    }

    .poi.loading::before {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: var(--accent);
      animation: poi-spin 0.7s linear infinite;
    }

    @keyframes poi-spin { to { transform: rotate(360deg); } }

    /* =========================
       TOOLTIP
       ========================= */
    .tooltip {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(calc(-50% + var(--tooltip-shift, 0px)));
      background: rgba(0,0,0,0.9);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      width: max-content;
      max-width: min(280px, calc(100vw - 24px));
      white-space: normal;
      text-align: center;
      font-size: 14px;
      line-height: 1.3;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 101;
    }

    .tooltip::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(calc(-50% - var(--tooltip-shift, 0px)));
      border-width: 6px;
      border-style: solid;
      border-color: rgba(0,0,0,0.9) transparent transparent transparent;
    }

    .poi.tooltip-below .tooltip {
      bottom: auto;
      top: 30px;
    }

    .poi.tooltip-below .tooltip::after {
      top: auto;
      bottom: 100%;
      border-color: transparent transparent rgba(0,0,0,0.9) transparent;
    }

    .poi:hover .tooltip, .poi:focus-visible .tooltip, .poi.active .tooltip {
      opacity: 1;
    }

    .poi:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    /* =========================
       LECTEUR AUDIO
       ========================= */
    .audio-player {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--player-bg);
      color: var(--player-text);
      z-index: 1000;
      box-shadow: 0 -1px 0 rgba(255,255,255,0.07);
    }

    /* Corps du lecteur */
    .player-body {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
    }

    /* Bouton play/pause */
    .audio-player button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      flex-shrink: 0;
    }

    .audio-player .play-pause {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 50%;
      position: relative;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .audio-player .play-pause:hover { transform: scale(1.06); }
    .audio-player .play-pause:active { transform: scale(0.95); }

    .audio-player .play-pause svg,
    .audio-player .close-btn svg { width: 16px; height: 16px; }

    .play-pause .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: poi-spin 0.7s linear infinite;
    }

    /* Infos + barre */
    .player-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .player-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }

    .player-progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-time {
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      min-width: 34px;
      text-align: center;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .player-progress {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.18);
      cursor: pointer;
      accent-color: var(--accent);
    }

    .player-progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
    }

    .player-progress::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: none;
      border-radius: 50%;
      background: white;
      cursor: pointer;
    }

    /* Chargement : shimmer sur la barre */
    .audio-player.loading .player-progress {
      background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.1) 75%);
      background-size: 200% 100%;
      animation: progress-loading 1.2s linear infinite;
      cursor: progress;
    }

    @keyframes progress-loading {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Bouton fermer */
    .close-btn {
      opacity: 0.5;
      transition: opacity 0.15s;
    }
    .close-btn:hover { opacity: 1; }

    /* =========================
       BOUTON PLEIN ÉCRAN
       ========================= */
    .fullscreen-btn {
      position: fixed;
      right: 16px;
      /* Toujours au-dessus du lecteur */
      bottom: calc(var(--player-height) + 12px);
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      backdrop-filter: blur(4px);
      transition: transform 0.15s ease, background 0.15s ease;
    }


    .fullscreen-btn:hover {
      background: rgba(0,0,0,0.9);
      transform: scale(1.06);
    }

    /* =========================
       MENTION LÉGALE
       ========================= */
    .legal-notice {
      position: fixed;
      left: 12px;
      /* Toujours au-dessus du lecteur, alignée avec le bouton plein écran */
      bottom: calc(var(--player-height) + 0px);
      z-index: 4;
      font-size: 10px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 8px;
      border-radius: 4px;
      line-height: 1.4;
      max-width: 260px;
      pointer-events: none;
      user-select: none;
    }

    /* =========================
       PLEIN ÉCRAN – TEXTES AGRANDIS
       ========================= */
    :root:fullscreen,
    html.is-fullscreen {
      font-size: 20px;
    }

    html.is-fullscreen .tooltip {
      font-size: 17px;
      padding: 10px 16px;
      max-width: min(360px, calc(100vw - 24px));
    }

    html.is-fullscreen .player-title {
      font-size: 18px;
    }

    html.is-fullscreen .player-time {
      font-size: 14px;
    }

    html.is-fullscreen .legal-notice {
      font-size: 13px;
    }

    html.is-fullscreen .audio-player .play-pause {
      width: 50px;
      height: 50px;
    }

    html.is-fullscreen .audio-player .play-pause svg,
    html.is-fullscreen .audio-player .close-btn svg {
      width: 20px;
      height: 20px;
    }

    html.is-fullscreen .play-pause .spinner {
      width: 20px;
      height: 20px;
    }

    html.is-fullscreen .player-body {
      padding: 16px 20px;
      gap: 18px;
    }

    /* =========================
       MOBILE
       ========================= */
    @media (max-width: 480px) {
      .player-title { font-size: 12.5px; }
      .player-body { padding: 10px 12px; gap: 10px; }

      .tooltip {
        font-size: 12px;
        padding: 6px 10px;
        max-width: min(220px, calc(100vw - 24px));
      }
    }
  </style>
</head>
<body>
  <div class="image-container" id="imageContainer">
    <img id="mapImage" src="fond de carte.jpg" alt="Carte des points d'intérêt">
  </div>

  <div class="audio-player" id="audioPlayer">
    <!-- Corps du lecteur -->
    <div class="player-body">
      <button class="play-pause" id="playPauseBtn" aria-label="Lecture / Pause">
        <svg id="playIcon" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="white" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        <span id="loadingSpinner" class="spinner" style="display:none;"></span>
      </button>

      <div class="player-info">
        <div class="player-title" id="playerTitle">Sélectionnez un point sur la carte pour lancer l'audio associé</div>
        <div class="player-progress-row">
          <span class="player-time" id="currentTime">0:00</span>
          <input type="range" class="player-progress" id="progressBar" value="0" min="0" max="100" step="0.1" disabled>
          <span class="player-time" id="duration">0:00</span>
        </div>
      </div>

      <button class="close-btn" id="closeBtn" aria-label="Fermer le lecteur" style="display:none;">
        <svg viewBox="0 0 24 24" fill="white" width="18" height="18"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
  </div>

  <button id="fullscreenBtn" class="fullscreen-btn" aria-label="Plein écran">⛶</button>

  <p class="legal-notice">Fond : Joseph Pinchon – Éditions Blondel-la-Rougery – 1945.</p>

  <script>
    /* =========================
       DONNÉES
       ========================= */
    const points = [
      { id: 1, x: 0.13726, y: 0.28711, title: "0. Place du Château-d'Eau, un lion mélancolique observe la Place de la République - Jennifer Buyck", audioUrl: "https://stream.gael-maignan.workers.dev/?id=1yT7gG25LapFyXDFsj9iV_8sdMBod5MZY" },
      { id: 2, x: 0.19985, y: 0.35817, title: "1. Passage du Jeu-de-Boules, une inconnue embrasse un casquetier", audioUrl: "https://stream.gael-maignan.workers.dev/?id=1lYo84SA1Hb3HhAPHvYc1WMox7Q0cH_Vs" },
      { id: 3, x: 0.27048, y: 0.46017, title: "2. Devant Bataclan, 90 clous pour se souvenir", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 4, x: 0.30659, y: 0.44756, title: "3. En face de Bataclan, un sergent-écrivain contribue à l'effort de guerre allemand", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 5, x: 0.35394, y: 0.52321, title: "4. Céline et Julie vont au cinéma", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 6, x: 0.39246, y: 0.50716, title: "5. Église Saint-Ambroise, la mariée ne manifeste pas", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 7, x: 0.43821, y: 0.60688, title: "6. Rue Sedaine, une confectionneuse tente d'empêcher un lynchage", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 8, x: 0.47031, y: 0.54040, title: "7. Défilé de statues devant la mairie", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 9, x: 0.53290, y: 0.70544, title: "8. Des autobus pour se rendre au gymnase", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 10, x: 0.58587, y: 0.74212, title: "9. Métro Charonne, Nestor Burma prend un coup sur la tête", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 11, x: 0.67415, y: 0.80745, title: "10. Rue des Boulets, une institutrice énumère des objets", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 12, x: 0.82583, y: 0.88309, title: "11. Rue de Montreuil, une couturière assiste à une inauguration", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 13, x: 0.74477, y: 0.88768, title: "12. Rue des Immeubles-Industriels, embellissement", audioUrl: "https://exemple.com/audios/sud-est.mp3" },
      { id: 14, x: 0.87077, y: 0.95874, title: "13. Casse-pipe à la Nation", audioUrl: "https://exemple.com/audios/sud-est.mp3" }
    ];

    /* =========================
       RÉFÉRENCES DOM
       ========================= */
    const container     = document.getElementById("imageContainer");
    const img           = document.getElementById("mapImage");
    const audioPlayer   = document.getElementById("audioPlayer");
    const playPauseBtn  = document.getElementById("playPauseBtn");
    const playIcon      = document.getElementById("playIcon");
    const pauseIcon     = document.getElementById("pauseIcon");
    const loadingSpinner = document.getElementById("loadingSpinner");
    const playerTitle   = document.getElementById("playerTitle");
    const progressBar   = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl    = document.getElementById("duration");
    const closeBtn      = document.getElementById("closeBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    const audio = new Audio();
    let currentMarker = null;
    let isSeeking = false;

    /* =========================
       GESTION HAUTEUR LECTEUR
       L'image se redimensionne pour rester entièrement visible.
       ========================= */
    function updatePlayerHeight() {
      const h = audioPlayer.getBoundingClientRect().height;
      document.documentElement.style.setProperty("--player-height", h + "px");
      positionMarkers();
      const active = document.querySelector(".poi.active");
      if (active) updateTooltipPosition(active, active.querySelector(".tooltip"));
    }

    /* =========================
       UTILITAIRES
       ========================= */
    function formatTime(seconds) {
      if (!isFinite(seconds)) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function setPlayerIconState(state) {
      playIcon.style.display    = state === "play"    ? "block" : "none";
      pauseIcon.style.display   = state === "pause"   ? "block" : "none";
      loadingSpinner.style.display = state === "loading" ? "block" : "none";
    }

    function setLoadingState(isLoading) {
      audioPlayer.classList.toggle("loading", isLoading);
      progressBar.disabled = isLoading;
      //if (currentMarker) currentMarker.classList.toggle("loading", isLoading);
      if (isLoading) setPlayerIconState("loading");
    }

    function getRenderedImageRect() {
      const cw = container.clientWidth;
      const ch = container.clientHeight;
      const nw = img.naturalWidth;
      const nh = img.naturalHeight;
      if (!nw || !nh) return { left: 0, top: 0, width: cw, height: ch };

      const containerRatio = cw / ch;
      const imageRatio = nw / nh;
      let width, height, left, top;

      if (imageRatio > containerRatio) {
        width = cw; height = cw / imageRatio;
        left = 0; top = (ch - height) / 2;
      } else {
        height = ch; width = ch * imageRatio;
        top = 0; left = (cw - width) / 2;
      }
      return { left, top, width, height };
    }

    function positionMarkers() {
      const rect = getRenderedImageRect();
      document.querySelectorAll(".poi").forEach((marker, index) => {
        const point = points[index];
        marker.style.left = `${rect.left + point.x * rect.width}px`;
        marker.style.top  = `${rect.top  + point.y * rect.height}px`;
      });
    }

    /* =========================
       TOOLTIP
       ========================= */
    const TOOLTIP_VIEWPORT_MARGIN = 8;

    function resetTooltipPosition(marker) {
      marker.style.setProperty("--tooltip-shift", "0px");
      marker.classList.remove("tooltip-below");
    }

    function updateTooltipPosition(marker, tooltip) {
      resetTooltipPosition(marker);
      const tooltipRect = tooltip.getBoundingClientRect();
      const m = TOOLTIP_VIEWPORT_MARGIN;
      let shift = 0;

      if (tooltipRect.left < m) {
        shift = m - tooltipRect.left;
      } else if (tooltipRect.right > window.innerWidth - m) {
        shift = (window.innerWidth - m) - tooltipRect.right;
      }
      marker.style.setProperty("--tooltip-shift", `${shift}px`);

      if (tooltipRect.top < m) marker.classList.add("tooltip-below");
    }

    /* =========================
       LECTEUR AUDIO
       ========================= */
    function openPlayer(point, marker) {
      if (currentMarker && currentMarker !== marker) {
        currentMarker.classList.remove("playing", "loading");
      }
      currentMarker = marker;
      marker.classList.remove("playing");

      playerTitle.textContent = point.title;
      closeBtn.style.display = "flex";
      progressBar.disabled = false;

      setLoadingState(true);
      audio.currentTime = 0;
      progressBar.value = 0;
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";

      audio.src = point.audioUrl;
      audio.play().catch(err => {
        console.warn("Lecture impossible :", err);
        handlePlaybackError();
      });
    }

    function closePlayer() {
      audio.pause();
      audioPlayer.classList.remove("loading");
      playerTitle.textContent = "Sélectionnez un point sur la carte";
      closeBtn.style.display = "none";
      progressBar.disabled = true;
      progressBar.value = 0;
      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";
      setPlayerIconState("play");

      if (currentMarker) {
        currentMarker.classList.remove("playing", "loading");
        currentMarker = null;
      }
    }

    function handlePlaybackError() {
      setLoadingState(false);
      setPlayerIconState("play");
      if (currentMarker) currentMarker.classList.remove("playing", "loading");
      playerTitle.textContent = "Erreur de lecture de l'audio";
    }

    /* =========================
       MARQUEURS
       ========================= */
    function createMarkers() {
      points.forEach((point, index) => {
        const marker = document.createElement("div");
        marker.className = "poi";
        marker.tabIndex = 0;
        marker.setAttribute("role", "button");
        marker.setAttribute("aria-label", point.title);

        marker.insertAdjacentHTML("beforeend", `
          <svg class="poi-star" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="12,1 14.53,8.52 22.46,8.6 16.09,13.33 18.47,20.9 12,16.3 5.53,20.9 7.91,13.33 1.54,8.6 9.47,8.52"></polygon>
          </svg>
        `);

        marker.querySelector(".poi-star").style.animationDelay = `${(index % 7) * 0.3}s`;

        const tooltip = document.createElement("div");
        tooltip.className = "tooltip";
        tooltip.textContent = point.title;
        marker.appendChild(tooltip);

        const activate = (e) => {
          e.stopPropagation();
          document.querySelectorAll(".poi.active").forEach(el => el.classList.remove("active"));
          marker.classList.add("active");
          updateTooltipPosition(marker, tooltip);
          openPlayer(point, marker);
        };

        marker.addEventListener("click", activate);
        marker.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(e); }
        });
        marker.addEventListener("mouseenter", () => updateTooltipPosition(marker, tooltip));
        marker.addEventListener("focus",      () => updateTooltipPosition(marker, tooltip));

        container.appendChild(marker);
      });
    }

    document.addEventListener("click", () => {
      document.querySelectorAll(".poi.active").forEach(el => el.classList.remove("active"));
    });

    /* =========================
       ÉVÉNEMENTS LECTEUR
       ========================= */
    playPauseBtn.addEventListener("click", () => {
      if (!currentMarker) return;
      audio.paused ? audio.play() : audio.pause();
    });

    closeBtn.addEventListener("click", closePlayer);

    audio.addEventListener("loadstart", () => setLoadingState(true));
    audio.addEventListener("waiting",   () => setLoadingState(true));

    audio.addEventListener("playing", () => {
      setLoadingState(false);
      setPlayerIconState("pause");
      if (currentMarker) currentMarker.classList.add("playing");
    });

    audio.addEventListener("pause", () => {
      if (!audioPlayer.classList.contains("loading")) setPlayerIconState("play");
    });

    audio.addEventListener("error", handlePlaybackError);

    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
      currentTimeEl.textContent = "0:00";
      progressBar.value = 0;
    });

    audio.addEventListener("timeupdate", () => {
      if (isSeeking) return;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      if (audio.duration) progressBar.value = (audio.currentTime / audio.duration) * 100;
    });

    audio.addEventListener("ended", () => {
      setPlayerIconState("play");
      if (currentMarker) currentMarker.classList.remove("playing");
    });

    progressBar.addEventListener("input", () => {
      if (!audio.duration) return;
      isSeeking = true;
      currentTimeEl.textContent = formatTime((progressBar.value / 100) * audio.duration);
    });

    progressBar.addEventListener("change", () => {
      if (audio.duration) audio.currentTime = (progressBar.value / 100) * audio.duration;
      isSeeking = false;
    });

    /* =========================
       PLEIN ÉCRAN
       ========================= */
    fullscreenBtn.addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (err) {
        console.error("Erreur plein écran :", err);
      }
    });

    // Verrouille la font-size de base et applique la classe is-fullscreen
    // pour agrandir les textes quand la page est en plein écran.
    function lockFontSize() {
      const isFS = !!document.fullscreenElement;
      document.documentElement.classList.toggle("is-fullscreen", isFS);
      // Pas de style.fontSize inline : on laisse le CSS gérer via :root:fullscreen / .is-fullscreen
      if (!isFS) {
        document.documentElement.style.fontSize = "16px";
      } else {
        document.documentElement.style.fontSize = ""; // laisse la CSS rule prendre le dessus
      }
    }
    lockFontSize();
    document.addEventListener("fullscreenchange", lockFontSize);
    document.addEventListener("webkitfullscreenchange", lockFontSize);

    /* =========================
       INITIALISATION
       ========================= */
    function handleViewportChange() {
      updatePlayerHeight();
    }

    window.addEventListener("resize", handleViewportChange);
    window.addEventListener("orientationchange", handleViewportChange);

    // Calcul initial de la hauteur du lecteur
    updatePlayerHeight();

    let markersCreated = false;

    function init() {
      if (markersCreated) return;
      markersCreated = true;
      createMarkers();
      updatePlayerHeight();
    }

    img.addEventListener("load", init);
    if (img.complete) init();
  </script>
</body>
</html>
