<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canaux d'accès — Ville Sonore</title>
<style>

  :root {
    --fond: #10151c;
    --fond-carte: #171e27;
    --trait: #2a3340;
    --texte: #eef1f4;
    --texte-att: #8b96a3;
    --accent-attente: #e8a33d;
    --accent-ok: #3ddc97;
    --accent-bloque: #e85d4d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    padding: 28px 18px 48px;
  }

  .entete {
    margin-bottom: 28px;
  }

  .entete .eyebrow {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-ok);
    margin: 0 0 10px;
  }

  .entete h1 {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 10px;
    font-weight: 600;
  }

  .entete p {
    font-size: 14px;
    line-height: 1.5;
    color: var(--texte-att);
    margin: 0;
    max-width: 46ch;
  }

  .console {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .canal {
    background: var(--fond-carte);
    border: 1px solid var(--trait);
    border-radius: 14px;
    padding: 16px 16px 16px 14px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
    transition: border-color 180ms ease;
  }

  .canal[data-etat="accordee"] {
    border-color: rgba(61, 220, 151, 0.35);
  }

  .canal[data-etat="bloquee"] {
    border-color: rgba(232, 93, 77, 0.35);
  }

  .voyant {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--texte-att);
    flex-shrink: 0;
    position: relative;
  }

  .canal[data-etat="accordee"] .voyant { background: var(--accent-ok); }
  .canal[data-etat="attente"] .voyant { background: var(--accent-attente); }
  .canal[data-etat="bloquee"] .voyant { background: var(--accent-bloque); }

  .canal[data-etat="accordee"] .voyant::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid var(--accent-ok);
    opacity: 0.5;
    animation: pulse-voyant 2.2s ease-out infinite;
  }

  @keyframes pulse-voyant {
    0% { transform: scale(0.8); opacity: 0.6; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .infos-canal .nom {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 3px;
  }

  .infos-canal .statut {
    font-size: 12.5px;
    color: var(--texte-att);
    margin: 0;
  }

  .canal[data-etat="accordee"] .statut { color: var(--accent-ok); }
  .canal[data-etat="bloquee"] .statut { color: var(--accent-bloque); }

  .onde {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 20px;
    margin-top: 6px;
  }

  .onde span {
    width: 2.5px;
    background: var(--trait);
    border-radius: 2px;
    height: 4px;
    transition: background 200ms ease;
  }

  .canal[data-etat="accordee"] .onde span {
    background: var(--accent-ok);
    animation: vibrer 1.1s ease-in-out infinite;
  }

  .canal[data-etat="accordee"] .onde span:nth-child(1) { animation-delay: 0s; height: 8px; }
  .canal[data-etat="accordee"] .onde span:nth-child(2) { animation-delay: 0.15s; height: 16px; }
  .canal[data-etat="accordee"] .onde span:nth-child(3) { animation-delay: 0.3s; height: 10px; }
  .canal[data-etat="accordee"] .onde span:nth-child(4) { animation-delay: 0.45s; height: 18px; }
  .canal[data-etat="accordee"] .onde span:nth-child(5) { animation-delay: 0.6s; height: 7px; }

  @keyframes vibrer {
    0%, 100% { transform: scaleY(0.6); }
    50% { transform: scaleY(1); }
  }

  .action button {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 9px;
    border: 1px solid var(--trait);
    background: transparent;
    color: var(--texte);
    cursor: pointer;
    white-space: nowrap;
    transition: background 150ms ease, border-color 150ms ease;
  }

  .action button:hover { border-color: var(--accent-attente); }
  .action button:focus-visible {
    outline: 2px solid var(--accent-attente);
    outline-offset: 2px;
  }

  .canal[data-etat="bloquee"] .action button {
    border-color: rgba(232, 93, 77, 0.5);
    color: var(--accent-bloque);
  }

  .canal[data-etat="accordee"] .action .etiquette-ok {
    font-size: 12.5px;
    color: var(--accent-ok);
    font-weight: 600;
  }

  .canal {
    flex-wrap: wrap;
  }

  .zone-test {
    grid-column: 1 / -1;
    margin-top: 6px;
    padding-top: 12px;
    border-top: 1px dashed var(--trait);
    display: none;
    flex-direction: column;
    gap: 10px;
    font-size: 13px;
  }

  .zone-test.visible { display: flex; }

  .zone-test .ligne-action {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .zone-test .bouton-secondaire {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--trait);
    background: transparent;
    color: var(--texte);
    cursor: pointer;
  }

  .zone-test .bouton-secondaire:hover { border-color: var(--accent-ok); }

  .zone-test .resultat {
    color: var(--texte-att);
    line-height: 1.5;
  }

  .zone-test .resultat.erreur { color: var(--accent-bloque); }
  .zone-test .resultat.succes { color: var(--accent-ok); }

  .metre {
    width: 100%;
    height: 10px;
    border-radius: 5px;
    background: var(--trait);
    overflow: hidden;
  }

  .metre .remplissage {
    height: 100%;
    width: 0%;
    background: var(--accent-ok);
    transition: width 80ms linear;
  }

  video.previsu {
    width: 100%;
    max-width: 260px;
    border-radius: 10px;
    border: 1px solid var(--trait);
    display: block;
    background: #000;
  }

  .pied {
    margin-top: 26px;
    font-size: 12px;
    color: var(--texte-att);
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: reduce) {
    .canal[data-etat="accordee"] .voyant::after,
    .canal[data-etat="accordee"] .onde span {
      animation: none;
    }
  }

</style>
</head>
<body>

  <div class="entete">
    <p class="eyebrow">Ville Sonore · Accès capteurs</p>
    <h1>Vérifie les canaux ouverts sur ton téléphone</h1>
    <p>Chaque canal correspond à un capteur utilisé pour contribuer aux relevés. Un canal fermé peut être ouvert à tout moment.</p>
  </div>

  <div class="console" id="console"></div>

  <p class="pied" id="pied-info"></p>

<script>

  // -----------------------------------------------------
  // DEFINITION DES CANAUX
  // -----------------------------------------------------

  const CANAUX = [
    { type: "microphone",    nom: "Microphone",   role: "Capte le niveau sonore ambiant" },
    { type: "location",      nom: "Localisation", role: "Situe chaque relevé sur la carte" },
    { type: "camera",        nom: "Caméra",       role: "Photo optionnelle jointe au signalement" },
    { type: "notifications", nom: "Notifications", role: "Alerte quand un relevé est validé" }
  ];

  const pontDisponible = () => typeof Android !== "undefined" && Android !== null;

  // Etat local utilisé quand la page est ouverte hors de l'app (aperçu
  // navigateur). Ici on ne simule plus : on reflète le vrai résultat des
  // API du navigateur (getUserMedia, geolocation, Notification).
  const etatSimule = {
    microphone: { accordee: false, refuseeDefinitivement: false },
    location: { accordee: false, refuseeDefinitivement: false },
    camera: { accordee: false, refuseeDefinitivement: false },
    notifications: { accordee: false, refuseeDefinitivement: false }
  };

  // Pistes média actuellement ouvertes (pour pouvoir les couper proprement)
  const flux = { microphone: null, camera: null };
  let animMicro = null;

  function obtenirEtat() {
    if (pontDisponible()) {
      try {
        return JSON.parse(Android.obtenirEtatPermissions());
      } catch (e) {
        return etatSimule;
      }
    }
    // Recale l'état simulé sur les vraies Permissions API quand elles existent,
    // sans écraser un octroi déjà obtenu dans cette page.
    if (navigator.permissions && navigator.permissions.query) {
      ["microphone", "geolocation", "camera"].forEach(nom => {
        navigator.permissions.query({ name: nom }).then(res => {
          const cle = nom === "geolocation" ? "location" : nom;
          if (res.state === "denied") etatSimule[cle].refuseeDefinitivement = true;
        }).catch(() => {});
      });
    }
    return etatSimule;
  }

  function demanderCanal(type, bloquee) {
    if (pontDisponible()) {
      if (bloquee) {
        Android.ouvrirParametresApplication();
      } else {
        Android.demanderPermission(type);
      }
      return;
    }

    // Aperçu navigateur : on déclenche la vraie demande de permission du
    // navigateur, avec le vrai résultat (accordée / refusée).
    if (bloquee) {
      afficherResultat(type, "Ouvre les réglages du site dans ton navigateur (icône cadenas dans la barre d'adresse) pour réautoriser ce canal.", "erreur");
      return;
    }

    switch (type) {
      case "microphone":
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          stream.getTracks().forEach(t => t.stop());
          etatSimule.microphone.accordee = true;
          etatSimule.microphone.refuseeDefinitivement = false;
          construire();
        }).catch(err => gererErreurPermission("microphone", err));
        break;
      case "camera":
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
          stream.getTracks().forEach(t => t.stop());
          etatSimule.camera.accordee = true;
          etatSimule.camera.refuseeDefinitivement = false;
          construire();
        }).catch(err => gererErreurPermission("camera", err));
        break;
      case "location":
        navigator.geolocation.getCurrentPosition(() => {
          etatSimule.location.accordee = true;
          etatSimule.location.refuseeDefinitivement = false;
          construire();
        }, err => gererErreurPermission("location", err), { timeout: 10000 });
        break;
      case "notifications":
        if (!("Notification" in window)) {
          afficherResultat("notifications", "Ce navigateur ne prend pas en charge les notifications.", "erreur");
          return;
        }
        Notification.requestPermission().then(res => {
          if (res === "granted") {
            etatSimule.notifications.accordee = true;
            etatSimule.notifications.refuseeDefinitivement = false;
          } else if (res === "denied") {
            etatSimule.notifications.refuseeDefinitivement = true;
          }
          construire();
        });
        break;
    }
  }

  function gererErreurPermission(type, err) {
    const nomErr = err && err.name;
    if (nomErr === "NotAllowedError" || nomErr === "PermissionDeniedError" || (err && err.code === 1)) {
      etatSimule[type].refuseeDefinitivement = true;
    }
    construire();
  }

  // -----------------------------------------------------
  // TESTS EN DIRECT (aperçu navigateur uniquement)
  // -----------------------------------------------------

  function arreterFlux(type) {
    if (flux[type]) {
      flux[type].getTracks().forEach(t => t.stop());
      flux[type] = null;
    }
    if (type === "microphone" && animMicro) {
      cancelAnimationFrame(animMicro);
      animMicro = null;
    }
  }

  function afficherResultat(type, texte, classe) {
    const zone = document.getElementById(`zone-test-${type}`);
    if (!zone) return;
    let resultat = zone.querySelector(".resultat");
    if (!resultat) {
      resultat = document.createElement("p");
      resultat.className = "resultat";
      zone.appendChild(resultat);
    }
    resultat.className = "resultat" + (classe ? ` ${classe}` : "");
    resultat.textContent = texte;
  }

  function testerMicrophone() {
    const zone = document.getElementById("zone-test-microphone");
    zone.innerHTML = `<div class="metre"><div class="remplissage" id="remplissage-micro"></div></div>`;
    afficherResultat("microphone", "Parle près du micro pour voir la jauge bouger…");

    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      flux.microphone = stream;
      const contexte = new (window.AudioContext || window.webkitAudioContext)();
      const source = contexte.createMediaStreamSource(stream);
      const analyseur = contexte.createAnalyser();
      analyseur.fftSize = 256;
      source.connect(analyseur);
      const donnees = new Uint8Array(analyseur.frequencyBinCount);
      const barre = document.getElementById("remplissage-micro");

      function boucle() {
        analyseur.getByteFrequencyData(donnees);
        const moyenne = donnees.reduce((a, b) => a + b, 0) / donnees.length;
        if (barre) barre.style.width = Math.min(100, moyenne * 1.8) + "%";
        animMicro = requestAnimationFrame(boucle);
      }
      boucle();

      // Coupe automatiquement le flux après 15s pour ne pas laisser le micro ouvert
      setTimeout(() => {
        arreterFlux("microphone");
        afficherResultat("microphone", "Test terminé, micro coupé.", "succes");
      }, 15000);
    }).catch(err => {
      afficherResultat("microphone", "Impossible d'accéder au micro : " + err.message, "erreur");
    });
  }

  function testerCamera() {
    const zone = document.getElementById("zone-test-camera");
    zone.innerHTML = `<video class="previsu" id="video-camera" autoplay playsinline muted></video>`;

    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
      flux.camera = stream;
      const video = document.getElementById("video-camera");
      video.srcObject = stream;
      afficherResultat("camera", "Aperçu en direct actif.", "succes");

      setTimeout(() => {
        arreterFlux("camera");
        afficherResultat("camera", "Test terminé, caméra coupée.", "succes");
      }, 15000);
    }).catch(err => {
      afficherResultat("camera", "Impossible d'accéder à la caméra : " + err.message, "erreur");
    });
  }

  function testerLocalisation() {
    const zone = document.getElementById("zone-test-location");
    zone.innerHTML = "";
    afficherResultat("location", "Recherche de la position…");

    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      afficherResultat("location", `Position : ${latitude.toFixed(5)}, ${longitude.toFixed(5)} (précision ≈ ${Math.round(accuracy)} m)`, "succes");
    }, err => {
      afficherResultat("location", "Impossible d'obtenir la position : " + err.message, "erreur");
    }, { enableHighAccuracy: true, timeout: 10000 });
  }

  function testerNotifications() {
    const zone = document.getElementById("zone-test-notifications");
    zone.innerHTML = "";
    if (Notification.permission !== "granted") {
      afficherResultat("notifications", "Autorise d'abord les notifications.", "erreur");
      return;
    }
    new Notification("Ville Sonore", { body: "Ceci est une notification de test." });
    afficherResultat("notifications", "Notification envoyée.", "succes");
  }

  const TESTS = {
    microphone: testerMicrophone,
    camera: testerCamera,
    location: testerLocalisation,
    notifications: testerNotifications
  };

  function basculerZoneTest(type) {
    const zone = document.getElementById(`zone-test-${type}`);
    if (!zone) return;
    const seraVisible = !zone.classList.contains("visible");
    zone.classList.toggle("visible", seraVisible);
    if (seraVisible) {
      TESTS[type]();
    } else {
      if (type === "microphone") arreterFlux("microphone");
      if (type === "camera") arreterFlux("camera");
      zone.innerHTML = "";
    }
  }

  function libelleStatut(etat) {
    if (etat.accordee) return "Canal ouvert";
    if (etat.refuseeDefinitivement) return "Fermé définitivement";
    return "Canal fermé";
  }

  function etatCss(etat) {
    if (etat.accordee) return "accordee";
    if (etat.refuseeDefinitivement) return "bloquee";
    return "attente";
  }

  function construire() {
    const etatComplet = obtenirEtat();
    const conteneur = document.getElementById("console");
    conteneur.innerHTML = "";

    CANAUX.forEach(canal => {
      const etat = etatComplet[canal.type] || { accordee: false, refuseeDefinitivement: false };
      const cssEtat = etatCss(etat);

      const carte = document.createElement("div");
      carte.className = "canal";
      carte.setAttribute("data-etat", cssEtat);

      const voyant = document.createElement("div");
      voyant.className = "voyant";

      const infos = document.createElement("div");
      infos.className = "infos-canal";
      infos.innerHTML = `
        <p class="nom">${canal.nom}</p>
        <p class="statut">${libelleStatut(etat)} · ${canal.role}</p>
        <div class="onde"><span></span><span></span><span></span><span></span><span></span></div>
      `;

      const action = document.createElement("div");
      action.className = "action";

      if (etat.accordee) {
        if (pontDisponible()) {
          action.innerHTML = `<span class="etiquette-ok">Actif</span>`;
        } else {
          const boutonTest = document.createElement("button");
          boutonTest.type = "button";
          boutonTest.textContent = "Tester";
          boutonTest.addEventListener("click", () => basculerZoneTest(canal.type));
          action.appendChild(boutonTest);
        }
      } else {
        const bouton = document.createElement("button");
        bouton.type = "button";
        bouton.textContent = etat.refuseeDefinitivement ? "Ouvrir les paramètres" : "Autoriser";
        bouton.addEventListener("click", () => demanderCanal(canal.type, etat.refuseeDefinitivement));
        action.appendChild(bouton);
      }

      const zoneTest = document.createElement("div");
      zoneTest.className = "zone-test";
      zoneTest.id = `zone-test-${canal.type}`;

      carte.appendChild(voyant);
      carte.appendChild(infos);
      carte.appendChild(action);
      if (!pontDisponible()) carte.appendChild(zoneTest);
      conteneur.appendChild(carte);
    });

    document.getElementById("pied-info").textContent = pontDisponible()
      ? ""
      : "Aperçu hors application — clique sur « Autoriser » puis « Tester » pour vérifier chaque capteur avec les vraies API du navigateur (nécessite HTTPS ou localhost).";
  }

  // -----------------------------------------------------
  // CALLBACKS APPELES DEPUIS ANDROID (MainActivity.kt)
  // -----------------------------------------------------

  window.onPermissionResult = function(type, accordee) {
    construire();
  };

  window.onPermissionsRefreshed = function() {
    construire();
  };

  document.addEventListener("DOMContentLoaded", construire);

</script>

</body>
</html>
