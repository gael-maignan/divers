<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historique des notifications</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #4fd1a5;
    --accent-dim: #2b6e57;
    --danger: #e5644a;
    --bleu: #58a6ff;
    --bleu-dim: #1f4a7a;
    --mono: "SF Mono", "Consolas", "Roboto Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 40px;
  }
  .retour {
    display: inline-block;
    font-size: 12.5px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 4px;
  }
  .sous-titre {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 20px;
  }

  .barre-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  button {
    appearance: none;
    border: 1px solid var(--accent-dim);
    background: rgba(79, 209, 165, 0.1);
    color: var(--accent);
    padding: 9px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    flex: 1;
    min-width: 120px;
  }
  button:active { transform: translateY(1px); }
  button.secondaire {
    border-color: var(--border);
    background: transparent;
    color: var(--text);
  }
  button.danger {
    border-color: #6e3229;
    background: rgba(229, 100, 74, 0.1);
    color: var(--danger);
  }

  .filtres {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .filtre {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .filtre.actif {
    color: var(--text);
    border-color: var(--accent-dim);
    background: rgba(79, 209, 165, 0.08);
  }

  #liste { display: flex; flex-direction: column; gap: 10px; }

  .entree {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .entree-entete {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .badge {
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.firebase {
    color: #ffb454;
    background: rgba(255, 180, 84, 0.12);
    border: 1px solid rgba(255, 180, 84, 0.35);
  }
  .badge.locale-instantanee {
    color: var(--accent);
    background: rgba(79, 209, 165, 0.1);
    border: 1px solid var(--accent-dim);
  }
  .badge.locale-programmee {
    color: var(--bleu);
    background: rgba(88, 166, 255, 0.1);
    border: 1px solid var(--bleu-dim);
  }
  .entree-titre {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
  }
  .entree-date {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .entree-message {
    font-size: 13px;
    color: var(--text);
    margin: 0 0 6px;
    line-height: 1.4;
  }
  .entree-url {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
  }

  #etatVide {
    text-align: center;
    padding: 40px 16px;
    color: var(--muted);
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>

  <a class="retour" href="index.html">← Accueil</a>

  <h1>Historique des notifications</h1>
  <p class="sous-titre">Firebase (push) et locales (instantanées / programmées), les plus récentes en premier</p>

  <div class="barre-actions">
    <button onclick="rafraichir()">Rafraîchir</button>
    <button class="danger" onclick="viderHistorique()">Vider l'historique</button>
  </div>

  <div class="filtres">
    <span class="filtre actif" data-filtre="tous">Toutes</span>
    <span class="filtre" data-filtre="firebase">Firebase</span>
    <span class="filtre" data-filtre="locale-instantanee">Locale instantanée</span>
    <span class="filtre" data-filtre="locale-programmee">Locale programmée</span>
  </div>

  <div id="liste"></div>
  <div id="etatVide">Aucune notification dans l'historique pour l'instant.</div>

<script>
  let toutesLesEntrees = [];
  let filtreActif = "tous";

  const LABELS_SOURCE = {
    "firebase": "Firebase",
    "locale-instantanee": "Locale instantanée",
    "locale-programmee": "Locale programmée"
  };

  function pontDisponible() {
    return typeof Android !== 'undefined' &&
      typeof Android.obtenirHistoriqueNotifications === 'function';
  }

  function formaterDate(horodatageMs) {
    const d = new Date(horodatageMs);
    return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR');
  }

  function echapperHtml(texte) {
    const div = document.createElement('div');
    div.textContent = texte ?? "";
    return div.innerHTML;
  }

  function rendre() {
    const liste = document.getElementById('liste');
    const etatVide = document.getElementById('etatVide');

    const entrees = filtreActif === "tous"
      ? toutesLesEntrees
      : toutesLesEntrees.filter(e => e.source === filtreActif);

    if (entrees.length === 0) {
      liste.innerHTML = "";
      etatVide.style.display = "block";
      return;
    }
    etatVide.style.display = "none";

    liste.innerHTML = entrees.map(e => `
      <div class="entree">
        <div class="entree-entete">
          <span class="badge ${e.source}">${LABELS_SOURCE[e.source] || e.source}</span>
          <span class="entree-titre">${echapperHtml(e.titre)}</span>
        </div>
        <p class="entree-message">${echapperHtml(e.message)}</p>
        <div class="entree-entete" style="margin-bottom:0;">
          ${e.urlCible ? `<span class="entree-url">→ ${echapperHtml(e.urlCible)}</span>` : '<span></span>'}
          <span class="entree-date" style="margin-left:auto;">${formaterDate(e.horodatage)}</span>
        </div>
      </div>
    `).join("");
  }

  function rafraichir() {
    if (!pontDisponible()) {
      document.getElementById('etatVide').style.display = "block";
      document.getElementById('etatVide').textContent =
        "Pont Android absent, ou binaire installé trop ancien (obtenirHistoriqueNotifications indisponible).";
      return;
    }

    try {
      const brut = Android.obtenirHistoriqueNotifications();
      toutesLesEntrees = JSON.parse(brut) || [];
    } catch (e) {
      toutesLesEntrees = [];
    }

    rendre();
  }

  function viderHistorique() {
    if (!pontDisponible()) return;

    if (!confirm("Vider tout l'historique des notifications ?")) return;

    Android.viderHistoriqueNotifications();
    rafraichir();
  }

  document.querySelectorAll('.filtre').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.filtre').forEach(f => f.classList.remove('actif'));
      el.classList.add('actif');
      filtreActif = el.dataset.filtre;
      rendre();
    });
  });

  rafraichir();
</script>

</body>
</html>
